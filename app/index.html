<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- The visitor's light / dark choice (theme.ts), applied before the first paint so the page does not flash. -->
    <script>
      try {
        document.querySelector('meta[name="color-scheme"]').content = localStorage.getItem('color-scheme') ?? 'light dark';
      } catch {}
    </script>
    <meta name="description" content="PartByPart – 3D building instructions, part by part." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23d91f2a' stroke-width='2.2'%3E%3Crect x='2.5' y='2.5' width='19' height='19' rx='3'/%3E%3Ccircle cx='8.5' cy='8.5' r='2.6' fill='%23d91f2a' stroke='none' fill-opacity='.8'/%3E%3Ccircle cx='15.5' cy='8.5' r='2.6' fill='%23d91f2a' stroke='none'/%3E%3Ccircle cx='8.5' cy='15.5' r='2.6' fill='%23d91f2a' stroke='none' fill-opacity='.6'/%3E%3Ccircle cx='15.5' cy='15.5' r='2.6' fill='%23d91f2a' stroke='none' fill-opacity='.4'/%3E%3C/svg%3E" />
    <title>PartByPart</title>
    <link rel="stylesheet" href="./src/scss/style.scss" />
  </head>
  <body>
    <canvas id="stage" role="img" aria-label="3D model of the build"></canvas>
    <div id="spacer"></div>
    <div id="ui"></div>
    <script type="module" src="./src/ts/main.ts"></script>
  </body>
</html>
